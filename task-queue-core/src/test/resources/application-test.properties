# Test Database (will be overridden by Testcontainers)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Redis (mock/embedded for tests)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Logging for tests
logging.level.com.mreyes.task_queue=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.testcontainers=INFO

# Disable scheduler for most tests (can enable per test)
# Note: Use @EnableScheduling in tests that need it

# noinspection SpringBootApplicationProperties
testcontainers.reuse.enable=true